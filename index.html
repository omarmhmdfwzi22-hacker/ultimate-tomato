<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ultimate Tomato — Creative Portfolio Platform</title>
    <meta name="description" content="Ultimate Tomato is a multi-tenant creative portfolio CMS and hosting platform. Crafted with precision, minimalist aesthetics, and soft depth." />
    <meta property="og:title" content="Ultimate Tomato — Creative Portfolio Platform" />
    <meta property="og:description" content="Discover creative client portfolios, case studies, and engineering craft." />
    <meta property="og:image" content="./assets/ultimate-tomato-logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/png" href="./assets/ultimate-tomato-logo.png" />
    <link rel="apple-touch-icon" href="./assets/ultimate-tomato-logo.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              tomato: {
                DEFAULT: '#F52F3A',
                50: '#FEEBED',
                100: '#FDD8DB',
                500: '#F52F3A',
                600: '#DC1C27',
                700: '#B0161F',
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            }
          }
        }
      };
    </script>

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        background-color: #050505;
        color: #FFFFFF;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100%;
        min-height: 100dvh;
        overflow-x: hidden;
        width: 100%;
        max-width: 100%;
        -webkit-text-size-adjust: 100%;
      }
      html.light, html.light body {
        background-color: #FAFAFA;
        color: #09090B;
      }
      #root {
        min-height: 100%;
        min-height: 100dvh;
        overflow-x: hidden;
        width: 100%;
        max-width: 100%;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 1rem);
      }
    </style>
  </head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-[#050505] dark:text-white min-h-screen transition-colors duration-200 antialiased selection:bg-[#F52F3A]/20 selection:text-[#F52F3A]">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050505;color:#ffffff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:24px;text-align:center;">
        <div style="width:64px;height:64px;border-radius:20px;background:rgba(245,47,58,0.1);border:1px solid rgba(245,47,58,0.25);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(245,47,58,0.25);">
          <img src="./assets/ultimate-tomato-logo.png" alt="Ultimate Tomato" style="width:40px;height:40px;object-contain:contain;" />
        </div>
        <div style="font-size:20px;font-weight:800;letter-spacing:-0.5px;color:#ffffff;margin-bottom:8px;">ULTIMATE TOMATO</div>
        <div style="font-size:13px;color:#71717a;font-weight:500;">Loading portfolio experience...</div>
      </div>
    </div>
    <script type="module" src="./app.js?v=1789927271887"></script>
  </body>
</html>
