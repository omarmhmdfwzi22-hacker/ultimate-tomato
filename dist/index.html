    <!-- Pre-load Branding & Theme Immediately -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('ut_cms_site_settings');
          var primary = '#F52F3A';
          var defaultTheme = 'dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.primary_color) primary = parsed.primary_color;
            if (parsed.default_theme) defaultTheme = parsed.default_theme;
          }
          var savedTheme = localStorage.getItem('ut_color_theme');
          var finalTheme = savedTheme || defaultTheme;
          var isDark = finalTheme === 'dark';
          if (finalTheme === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
          }

          var clean = primary.replace('#', '').trim();
          if (clean.length === 3) clean = clean.split('').map(function(c){return c+c;}).join('');
          var num = parseInt(clean, 16);
          var r = 245, g = 47, b = 58;
          if (!isNaN(num) && clean.length === 6) {
            r = (num >> 16) & 255;
            g = (num >> 8) & 255;
            b = num & 255;
          }
          root.style.setProperty('--primary-brand', primary);
          root.style.setProperty('--primary-brand-rgb', r + ', ' + g + ', ' + b);
          root.style.setProperty('--primary', primary);
        } catch(e) {}
      })();
    </script>
